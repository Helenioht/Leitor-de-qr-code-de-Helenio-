<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Helenio</title>
    <link rel="icon" type="image/png" href="watermarked_img_14409463943066560873.jpg">
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --primary-variant: #3700b3;
            --on-surface: #e0e0e0;
            --on-primary: #000000;
            --error-color: #cf6679;
            --success-color: #03dac6;
            --gold-color: #d4af37;
            --warning-color: #ffb74d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--on-surface);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            box-shadow: 0 4px 12px rgba(187, 134, 252, 0.3);
            margin-bottom: 12px;
            object-fit: cover;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--gold-color);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .banner-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            border: 1px solid #333;
            margin-bottom: 4px;
        }

        .banner-img {
            width: 100%;
            height: auto;
            max-height: 180px;
            object-fit: cover;
            display: block;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            background-color: #2d2d2d;
            border: none;
            color: var(--on-surface);
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: var(--on-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            min-height: 280px;
        }

        .camera-controls {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(100px, 1fr));
            gap: 8px;
            margin-top: 10px;
        }

        .control-btn {
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: var(--on-surface);
            padding: 10px 8px;
            border-radius: 8px;
            font-size: 0.85rem;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }

        .control-btn.active {
            background-color: var(--warning-color);
            color: #000;
            border-color: var(--warning-color);
        }

        .control-btn:focus {
            outline: 2px solid var(--primary-color);
        }

        .control-icon {
            font-size: 1.2rem;
        }

        .slider-container {
            margin-top: 8px;
            padding: 8px;
            background-color: #252525;
            border-radius: 6px;
        }

        .slider-label {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--primary-color);
        }

        .btn {
            background-color: var(--primary-color);
            color: var(--on-primary);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-secondary {
            background-color: #2d2d2d;
            color: var(--on-surface);
            border: 1px solid #444;
        }

        input[type="file"] {
            display: none;
        }

        .file-drop-area {
            border: 2px dashed #444;
            border-radius: 8px;
            padding: 30px 16px;
            text-align: center;
            cursor: pointer;
            background-color: rgba(255,255,255,0.02);
            transition: border-color 0.2s;
        }

        .file-drop-area:hover {
            border-color: var(--primary-color);
        }

        .result-box {
            background-color: #252525;
            border-radius: 8px;
            padding: 12px;
            border-left: 4px solid var(--primary-color);
            word-break: break-all;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .result-label {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-text {
            font-size: 0.95rem;
            font-family: monospace;
            margin-bottom: 8px;
        }

        .actions-group {
            display: flex;
            gap: 8px;
        }

        .actions-group .btn {
            flex: 1;
            padding: 10px;
            font-size: 0.9rem;
        }

        .history-list {
            list-style: none;
            max-height: 180px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            background-color: #252525;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .history-item span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: monospace;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--success-color);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 1000;
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }

        .toast.error {
            background-color: var(--error-color);
            color: #fff;
        }

        .mode-indicator {
            font-size: 0.75rem;
            color: #888;
            margin-top: 6px;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <header>
        <img src="watermarked_img_14409463943066560873.jpg" alt="Leitor de Helenio" class="app-icon">
        <h1>Leitor de Helenio</h1>
        <div class="subtitle">QR Code • Código de Barras</div>
    </header>

    <div class="container">
        <div class="banner-container">
            <img src="https://ibb.co/N245pV0g" alt="Banner Leitor de Helenio" class="banner-img" onerror="this.style.display='none'">
        </div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('camera')">📷 Câmera</button>
            <button class="tab-btn" onclick="switchTab('file')">🖼️ Arquivo</button>
        </div>

        <!-- Seção Câmera com Novos Controles -->
        <div id="tab-camera" class="tab-content active card">
            <div id="reader"></div>
            
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button class="btn" id="start-camera" onclick="startCamera()">▶️ Iniciar</button>
                <button class="btn btn-secondary" id="stop-camera" onclick="stopCamera()" style="display:none;">⏹️ Parar</button>
            </div>

            <!-- Painel de Controles da Câmera -->
            <div id="camera-controls-panel" class="hidden">
                <div class="camera-controls">
                    <button class="control-btn" id="toggle-flash" onclick="toggleFlash()">
                        <span class="control-icon">💡</span>
                        <span>Lanterna</span>
                    </button>
                    <button class="control-btn" id="toggle-continuous" onclick="toggleContinuous()">
                        <span class="control-icon">🔁</span>
                        <span>Contínuo</span>
                    </button>
                    <button class="control-btn" id="toggle-invert" onclick="toggleInvert()">
                        <span class="control-icon">🔄</span>
                        <span>Inverter</span>
                    </button>
                    <button class="control-btn" id="switch-camera" onclick="switchCamera()">
                        <span class="control-icon">🔍</span>
                        <span>Câmera</span>
                    </button>
                </div>

                <!-- Controle de Zoom/Foco -->
                <div class="slider-container">
                    <div class="slider-label">
                        <span>Zoom</span>
                        <span id="zoom-value">1.0x</span>
                    </div>
                    <input type="range" id="zoom-slider" min="1" max="5" step="0.1" value="1" oninput="updateZoom(this.value)">
                    <p class="mode-indicator">💡 Dica: aproxime o código e mantenha a câmera estável para melhor leitura</p>
                </div>
            </div>
        </div>

        <!-- Seção Arquivo -->
        <div id="tab-file" class="tab-content card">
            <div class="file-drop-area" onclick="document.getElementById('file-input').click()">
                <p>📂 Toque para selecionar imagem</p>
                <span style="font-size: 0.8rem; color: #888; margin-top: 4px; display: block;">PNG, JPG, WEBP</span>
            </div>
            <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)">
        </div>

        <!-- Resultado -->
        <div class="card">
            <div class="result-label">📋 Último Código Lido</div>
            <div class="result-box">
                <div id="result-content" class="result-text" style="color: #666;">Nenhum código lido ainda</div>
            </div>
            <div class="actions-group" style="margin-top: 12px;">
                <button class="btn" id="btn-copy" onclick="copyResult()" disabled>📋 Copiar</button>
                <button class="btn btn-secondary" id="btn-open" onclick="openResult()" disabled>🔗 Abrir Link</button>
                <button class="btn btn-secondary" id="btn-share" onclick="shareResult()" disabled>📤 Compartilhar</button>
            </div>
        </div>

        <!-- Histórico -->
        <div class="card" style="flex: 1;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <div class="result-label" style="margin: 0;">📝 Histórico Recente</div>
                <button onclick="clearHistory()" style="background:none; border:none; color: var(--error-color); font-size: 0.75rem; cursor:pointer;">🗑️ Limpar</button>
            </div>
            <ul id="history-list" class="history-list">
                <li style="color: #666; font-size: 0.8rem; text-align: center; padding: 10px;">Vazio</li>
            </ul>
        </div>
    </div>

    <div id="toast" class="toast">Copiado!</div>

    <script>
        let html5QrCode = null;
        let lastScannedText = "";
        let history = JSON.parse(localStorage.getItem('helenio_reader_history') || '[]');
        let torchOn = false;
        let continuousMode = false;
        let invertMode = false;
        let cameraFacingMode = "environment";
        let videoTrack = null;

        renderHistory();

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'camera') {
                document.querySelector('.tabs button:nth-child(1)').classList.add('active');
                document.getElementById('tab-camera').classList.add('active');
            } else {
                stopCamera();
                document.querySelector('.tabs button:nth-child(2)').classList.add('active');
                document.getElementById('tab-file').classList.add('active');
            }
        }

        async function startCamera() {
            const startBtn = document.getElementById('start-camera');
            const stopBtn = document.getElementById('stop-camera');
            const controlsPanel = document.getElementById('camera-controls-panel');
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            try {
                const config = { 
                    fps: 15, 
                    qrbox: { width: 250, height: 250 },
                    aspectRatio: 1.0
                };

                await html5QrCode.start(
                    { facingMode: cameraFacingMode }, 
                    config, 
                    onScanSuccess,
                    onScanFailure
                );

                // Obter a faixa de vídeo para controle de lanterna/zoom
                setTimeout(async () => {
                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ 
                            video: { facingMode: cameraFacingMode } 
                        });
                        videoTrack = stream.getVideoTracks()[0];
                    } catch (e) {
                        console.log("Controles avançados indisponíveis");
                    }
                }, 500);

                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';
                controlsPanel.classList.remove('hidden');
                showToast("Câmera iniciada ✅");
            } catch (err) {
                console.error("Erro ao iniciar câmera:", err);
                showToast("❌ Não foi possível acessar a câmera", true);
            }
        }

        async function stopCamera() {
            if (videoTrack) {
                videoTrack.stop();
                videoTrack = null;
            }
            
            if (html5QrCode && html5QrCode.isScanning) {
                try {
                    await html5QrCode.stop();
                } catch (err) {
                    console.error("Erro ao parar câmera:", err);
                }
            }
            
            torchOn = false;
            updateFlashUI();
            
            document.getElementById('start-camera').style.display = 'block';
            document.getElementById('stop-camera').style.display = 'none';
            document.getElementById('camera-controls-panel').classList.add('hidden');
        }

        function onScanSuccess(decodedText, decodedResult) {
            if (!continuousMode && lastScannedText === decodedText) return;
            
            // Vibração ao ler com sucesso
            if (navigator.vibrate) navigator.vibrate(100);
            
            handleScanSuccess(decodedText);
        }

        function onScanFailure(error) {
            // Silenciar erros contínuos
        }

        // 🔦 Lanterna
        async function toggleFlash() {
            if (!videoTrack || !videoTrack.getCapabilities || !videoTrack.getCapabilities().torch) {
                showToast("⚠️ Lanterna não suportada", true);
                return;
            }
            
            try {
                torchOn = !torchOn;
                await videoTrack.applyConstraints({ advanced: [{ torch: torchOn }] });
                updateFlashUI();
            } catch (e) {
                showToast("⚠️ Não foi possível controlar a lanterna", true);
            }
        }

        function updateFlashUI() {
            const btn = document.getElementById('toggle-flash');
            if (torchOn) btn.classList.add('active');
            else btn.classList.remove('active');
        }

        // 🔁 Modo Contínuo
        function toggleContinuous() {
            continuousMode = !continuousMode;
            const btn = document.getElementById('toggle-continuous');
            btn.classList.toggle('active', continuousMode);
            showToast(continuousMode ? "Modo contínuo ativado" : "Modo contínuo desativado");
        }

        // 🔄 Inverter imagem
        function toggleInvert() {
            invertMode = !invertMode;
            const btn = document.getElementById('toggle-invert');
            btn.classList.toggle('active', invertMode);
            showToast(invertMode ? "Inversão ativada" : "Inversão desativada");
        }

        // 🔄 Trocar câmera (frente/tras)
        async function switchCamera() {
            cameraFacingMode = cameraFacingMode === "environment" ? "user" : "environment";
            
            if (html5QrCode && html5QrCode.isScanning) {
                await stopCamera();
                await startCamera();
            }
            
            showToast(cameraFacingMode === "environment" ? "Câmera traseira" : "Câmera frontal");
        }

        // 🔍 Zoom
        async function updateZoom(value) {
            document.getElementById('zoom-value').textContent = value + 'x';
            
            if (!videoTrack || !videoTrack.getCapabilities || !videoTrack.getCapabilities().zoom) return;
            
            try {
                await videoTrack.applyConstraints({ 
                    advanced: [{ zoom: parseFloat(value) }] 
                });
            } catch (e) {
                // Ignorar erros de zoom
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            showToast("Processando imagem...");
            
            const html5QrCodeFile = new Html5Qrcode("reader");
            html5QrCodeFile.scanFile(file, true)
                .then(decodedText => {
                    handleScanSuccess(decodedText);
                })
                .catch(err => {
                    showToast("❌ Nenhum código encontrado", true);
                });
            
            event.target.value = '';
        }

        function handleScanSuccess(text) {
            lastScannedText = text;
            const resultContent = document.getElementById('result-content');
            resultContent.textContent = text;
            resultContent.style.color = 'var(--on-surface)';

            document.getElementById('btn-copy').removeAttribute('disabled');
            document.getElementById('btn-share').removeAttribute('disabled');
            
            const btnOpen = document.getElementById('btn-open');
            if (isValidUrl(text)) {
                btnOpen.removeAttribute('disabled');
            } else {
                btnOpen.setAttribute('disabled', 'true');
            }

            addToHistory(text);
            showToast("✅ Código lido com sucesso!");
        }

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === "http:" || url.protocol === "https:";
            } catch (_) {
                return false;
            }
        }

        function copyResult() {
            if (!lastScannedText) return;
            navigator.clipboard.writeText(lastScannedText).then(() => {
                showToast("✅ Copiado para a memória!");
            }).catch(err => {
                showToast("❌ Erro ao copiar", true);
            });
        }

        function openResult() {
            if (isValidUrl(lastScannedText)) {
                window.open(lastScannedText, '_blank');
            }
        }

        function shareResult() {
            if (!lastScannedText) return;
            
            if (navigator.share) {
                navigator.share({
                    title: 'Código lido',
                    text: lastScannedText
                }).catch(() => {});
            } else {
                copyResult();
            }
        }

        function addToHistory(text) {
            history = history.filter(item => item !== text);
            history.unshift(text);
            if (history.length > 15) history.pop();
            localStorage.setItem('helenio_reader_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (history.length === 0) {
                list.innerHTML = `<li style="color: #666; font-size: 0.8rem; text-align: center; padding: 10px;">Vazio</li>`;
                return;
            }
            list.innerHTML = history.map(item => `
                <li class="history-item">
                    <span title="${item}">${item.length > 35 ? item.substring(0, 35) + '...' : item}</span>
                    <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="loadFromHistory('${item.replace(/'/g, "\\'")}')">Usar</button>
                </li>
            `).join('');
        }

        function loadFromHistory(text) {
            handleScanSuccess(text);
        }

        function clearHistory() {
            history = [];
            localStorage.removeItem('helenio_reader_history');
            renderHistory();
            showToast("Histórico limpo");
        }

        function showToast(message, isError = false) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.className = 'toast show' + (isError ? ' error' : '');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
