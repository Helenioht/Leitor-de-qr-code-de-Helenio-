<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leitor de Helenio</title>
    <!-- Favicon / Ícone do aplicativo -->
    <link rel="icon" type="image/png" href="watermarked_img_14409463943066560873.jpg">
    <!-- Bibliotecas para leitura de QR Code e Código de Barras -->
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        :root {
            --bg-color: #121212;
            --surface-color: #1e1e1e;
            --primary-color: #bb86fc;
            --primary-variant: #3700b3;
            --on-surface: #e0e0e0;
            --on-primary: #000000;
            --error-color: #cf6679;
            --success-color: #03dac6;
            --gold-color: #d4af37;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--on-surface);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 16px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .app-icon {
            width: 80px;
            height: 80px;
            border-radius: 18px;
            box-shadow: 0 4px 12px rgba(187, 134, 252, 0.3);
            margin-bottom: 12px;
            object-fit: cover;
        }

        h1 {
            font-size: 1.6rem;
            color: var(--primary-color);
            margin-bottom: 6px;
        }

        .subtitle {
            font-size: 0.9rem;
            color: var(--gold-color);
            font-weight: 600;
            letter-spacing: 0.3px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: 12px;
            padding: 16px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .banner-container {
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0,0,0,0.4);
            border: 1px solid #333;
            margin-bottom: 4px;
        }

        .banner-img {
            width: 100%;
            height: auto;
            max-height: 180px;
            object-fit: cover;
            display: block;
        }

        .tabs {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            flex: 1;
            background-color: #2d2d2d;
            border: none;
            color: var(--on-surface);
            padding: 10px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .tab-btn.active {
            background-color: var(--primary-color);
            color: var(--on-primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        #reader {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background: #000;
            min-height: 250px;
        }

        .btn {
            background-color: var(--primary-color);
            color: var(--on-primary);
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            text-align: center;
            transition: opacity 0.2s;
        }

        .btn:active {
            opacity: 0.8;
        }

        .btn-secondary {
            background-color: #2d2d2d;
            color: var(--on-surface);
            border: 1px solid #444;
        }

        input[type="file"] {
            display: none;
        }

        .file-drop-area {
            border: 2px dashed #444;
            border-radius: 8px;
            padding: 30px 16px;
            text-align: center;
            cursor: pointer;
            background-color: rgba(255,255,255,0.02);
            transition: border-color 0.2s;
        }

        .file-drop-area:hover {
            border-color: var(--primary-color);
        }

        .result-box {
            background-color: #252525;
            border-radius: 8px;
            padding: 12px;
            border-left: 4px solid var(--primary-color);
            word-break: break-all;
            min-height: 60px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .result-label {
            font-size: 0.75rem;
            color: #888;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .result-text {
            font-size: 0.95rem;
            font-family: monospace;
            margin-bottom: 8px;
        }

        .actions-group {
            display: flex;
            gap: 8px;
        }

        .actions-group .btn {
            flex: 1;
            padding: 10px;
            font-size: 0.9rem;
        }

        .history-list {
            list-style: none;
            max-height: 150px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .history-item {
            background-color: #252525;
            padding: 8px 12px;
            border-radius: 6px;
            font-size: 0.85rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
        }

        .history-item span {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-family: monospace;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background-color: var(--success-color);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <header>
        <!-- Ícone do aplicativo -->
        <img src="watermarked_img_14409463943066560873.jpg" alt="Leitor de Helenio" class="app-icon">
        <h1>Leitor de Helenio</h1>
        <!-- Descrição em letras douradas -->
        <div class="subtitle">Leitor de QR Code e Código de Barras</div>
    </header>

    <div class="container">
        <!-- Imagem no corpo do aplicativo -->
        <div class="banner-container">
            <img src="https://ibb.co/N245pV0g" alt="Banner Leitor de Helenio" class="banner-img" onerror="this.style.display='none'">
        </div>

        <!-- Abas de navegação -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('camera')">Câmera</button>
            <button class="tab-btn" onclick="switchTab('file')">Arquivo / Imagem</button>
        </div>

        <!-- Seção Câmera -->
        <div id="tab-camera" class="tab-content active card">
            <div id="reader"></div>
            <div style="display: flex; gap: 8px; margin-top: 8px;">
                <button class="btn" id="start-camera" onclick="startCamera()">Iniciar Câmera</button>
                <button class="btn btn-secondary" id="stop-camera" onclick="stopCamera()" style="display:none;">Parar</button>
            </div>
        </div>

        <!-- Seção Arquivo -->
        <div id="tab-file" class="tab-content card">
            <div class="file-drop-area" onclick="document.getElementById('file-input').click()">
                <p>Toque para selecionar imagem ou arquivo com código</p>
                <span style="font-size: 0.8rem; color: #888; margin-top: 4px; display: block;">PNG, JPG, WEBP</span>
            </div>
            <input type="file" id="file-input" accept="image/*" onchange="handleFileSelect(event)">
        </div>

        <!-- Seção Resultado -->
        <div class="card">
            <div class="result-label">Último Código Lido</div>
            <div class="result-box">
                <div id="result-content" class="result-text" style="color: #666;">Nenhum código lido ainda</div>
            </div>
            <div class="actions-group" style="margin-top: 12px;">
                <button class="btn" id="btn-copy" onclick="copyResult()" disabled>Copiar</button>
                <button class="btn btn-secondary" id="btn-open" onclick="openResult()" disabled>Abrir Link</button>
            </div>
        </div>

        <!-- Seção Histórico -->
        <div class="card" style="flex: 1;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <div class="result-label" style="margin: 0;">Histórico Recente</div>
                <button onclick="clearHistory()" style="background:none; border:none; color: var(--error-color); font-size: 0.75rem; cursor:pointer;">Limpar</button>
            </div>
            <ul id="history-list" class="history-list">
                <li style="color: #666; font-size: 0.8rem; text-align: center; padding: 10px;">Vazio</li>
            </ul>
        </div>
    </div>

    <div id="toast" class="toast">Copiado para a memória!</div>

    <script>
        let html5QrCode = null;
        let lastScannedText = "";
        let history = JSON.parse(localStorage.getItem('helenio_reader_history') || '[]');

        renderHistory();

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));

            if (tabName === 'camera') {
                document.querySelector('.tabs button:nth-child(1)').classList.add('active');
                document.getElementById('tab-camera').classList.add('active');
            } else {
                stopCamera();
                document.querySelector('.tabs button:nth-child(2)').classList.add('active');
                document.getElementById('tab-file').classList.add('active');
            }
        }

        async function startCamera() {
            const startBtn = document.getElementById('start-camera');
            const stopBtn = document.getElementById('stop-camera');
            
            if (!html5QrCode) {
                html5QrCode = new Html5Qrcode("reader");
            }

            try {
                const qrCodeSuccessCallback = (decodedText, decodedResult) => {
                    handleScanSuccess(decodedText);
                };

                const config = { fps: 10, qrbox: { width: 250, height: 250 } };

                await html5QrCode.start({ facingMode: "environment" }, config, qrCodeSuccessCallback);
                startBtn.style.display = 'none';
                stopBtn.style.display = 'block';
            } catch (err) {
                console.error("Erro ao iniciar câmera:", err);
                alert("Não foi possível acessar a câmera. Verifique as permissões do navegador.");
            }
        }

        async function stopCamera() {
            if (html5QrCode && html5QrCode.isScanning) {
                try {
                    await html5QrCode.stop();
                } catch (err) {
                    console.error("Erro ao parar câmera:", err);
                }
            }
            document.getElementById('start-camera').style.display = 'block';
            document.getElementById('stop-camera').style.display = 'none';
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = e => {
                const image = new Image();
                image.onload = () => {
                    const canvas = document.createElement('canvas');
                    const context = canvas.getContext('2d');
                    canvas.width = image.width;
                    canvas.height = image.height;
                    context.drawImage(image, 0, 0, canvas.width, canvas.height);
                    
                    const imageData = context.getImageData(0, 0, canvas.width, canvas.height);
                    const code = jsQR(imageData.data, imageData.width, imageData.height, {
                        inversionAttempts: "dontInvert",
                    });

                    if (code) {
                        handleScanSuccess(code.data);
                    } else {
                        const html5QrCodeFile = new Html5Qrcode("reader");
                        html5QrCodeFile.scanFile(file, true)
                            .then(decodedText => {
                                handleScanSuccess(decodedText);
                            })
                            .catch(err => {
                                alert("Nenhum QR Code ou código de barras válido encontrado na imagem.");
                            });
                    }
                };
                image.src = e.target.result;
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function handleScanSuccess(text) {
            lastScannedText = text;
            const resultContent = document.getElementById('result-content');
            resultContent.textContent = text;
            resultContent.style.color = 'var(--on-surface)';

            document.getElementById('btn-copy').removeAttribute('disabled');
            
            const btnOpen = document.getElementById('btn-open');
            if (isValidUrl(text)) {
                btnOpen.removeAttribute('disabled');
            } else {
                btnOpen.setAttribute('disabled', 'true');
            }

            addToHistory(text);
            showToast("Código lido com sucesso!");
        }

        function isValidUrl(string) {
            try {
                const url = new URL(string);
                return url.protocol === "http:" || url.protocol === "https:";
            } catch (_) {
                return false;
            }
        }

        function copyResult() {
            if (!lastScannedText) return;
            navigator.clipboard.writeText(lastScannedText).then(() => {
                showToast("Copiado para a memória!");
            }).catch(err => {
                console.error("Erro ao copiar:", err);
            });
        }

        function openResult() {
            if (isValidUrl(lastScannedText)) {
                window.open(lastScannedText, '_blank');
            }
        }

        function addToHistory(text) {
            history = history.filter(item => item !== text);
            history.unshift(text);
            if (history.length > 10) history.pop();
            localStorage.setItem('helenio_reader_history', JSON.stringify(history));
            renderHistory();
        }

        function renderHistory() {
            const list = document.getElementById('history-list');
            if (history.length === 0) {
                list.innerHTML = `<li style="color: #666; font-size: 0.8rem; text-align: center; padding: 10px;">Vazio</li>`;
                return;
            }
            list.innerHTML = history.map(item => `
                <li class="history-item">
                    <span title="${item}">${item}</span>
                    <button class="btn btn-secondary" style="padding: 4px 8px; font-size: 0.75rem;" onclick="loadFromHistory('${item.replace(/'/g, "\\'")}')">Usar</button>
                </li>
            `).join('');
        }

        function loadFromHistory(text) {
            handleScanSuccess(text);
        }

        function clearHistory() {
            history = [];
            localStorage.removeItem('helenio_reader_history');
            renderHistory();
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }
    </script>
</body>
</html>
